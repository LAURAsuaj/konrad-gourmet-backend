# Konrad Gourmet - Entorno Staging (Docker Compose)
#
# Dos contenedores independientes que comparten la misma base de datos (Supabase):
#   api   la API HTTP con el publicador del Outbox
#   cron  los procesos automáticos (descuento diario, tendencias, reintento de precios)
#
# Preparación:
#   1. Copie .env.example a .env y complete los valores (DATABASE_URL, JWT_SECRET, SMTP_*, ...).
#   2. Aplique el esquema en Supabase una sola vez:  npm run db:schema   (requiere psql)
#   3. Coloque el certificado y la llave TLS en ./certs como fullchain.pem y privkey.pem
#      (o cambie CERTS_DIR). Para pruebas, uno autofirmado:
#        openssl req -x509 -newkey rsa:2048 -nodes -keyout certs/privkey.pem -out certs/fullchain.pem -days 30 -subj "/CN=localhost"
#      Si un proxy externo termina TLS 1.3, quite HTTPS_CERT_PATH/HTTPS_KEY_PATH, el volumen
#      de certificados y defina TRUST_PROXY=true.
#   4. Levante:  docker compose up -d --build
#   5. Cree el primer administrador (una sola vez):
#        docker compose run --rm -e ADMIN_NOMBRE="Nombre" -e ADMIN_CORREO=admin@empresa.com -e ADMIN_PASSWORD='Clave12345' api npm run admin:crear
#
# El servicio cron debe ejecutarse en UNA sola instancia por entorno.

name: konrad-gourmet-staging

x-endurecimiento: &endurecimiento
  restart: unless-stopped
  read_only: true
  tmpfs:
    - /tmp
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "5"

services:
  api:
    <<: *endurecimiento
    build:
      context: .
      dockerfile: Dockerfile.api
    image: konrad-gourmet/api:staging
    container_name: kg-api
    env_file: .env
    environment:
      NODE_ENV: production
      PORT: "3000"
      HTTPS_CERT_PATH: /certs/fullchain.pem
      HTTPS_KEY_PATH: /certs/privkey.pem
    ports:
      - "${API_PUBLIC_PORT:-8443}:3000"
    volumes:
      - ${CERTS_DIR:-./certs}:/certs:ro

  cron:
    <<: *endurecimiento
    build:
      context: .
      dockerfile: Dockerfile.cron
    image: konrad-gourmet/cron:staging
    container_name: kg-cron
    env_file: .env
    environment:
      NODE_ENV: production
    depends_on:
      - api
